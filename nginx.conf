server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Probe de salud: platform-app usa /health por defecto (healthCheck.path).
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Release marker for the canary demo: never cached, so each request shows
    # which version answered. add_header here replaces the server-level ones,
    # so they are repeated.
    location = /version.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location /assets/ { try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
